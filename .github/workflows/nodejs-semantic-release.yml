name: NodeJS Semantic Release

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
        description: Node.js version to use when setting up. (eg. 20.x, 18.x)
    secrets:
      release_token:
        required: true
        description: Token with write access that can bypass branch protection, used for the git push/tag and GitHub release creation.
    outputs:
        pkg-version:
            description: "The current release version"
            value: ${{ jobs.semantic-release.outputs.pkg-version }}
        prev-pkg-version:
                description: "The previous release version"
                value: ${{ jobs.semantic-release.outputs.prev-pkg-version }}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      pkg-version: ${{ steps.get-version.outputs.pkg-ver }}
      prev-pkg-version: ${{ steps.get-previous-version.outputs.prev-pkg-ver }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.release_token }}

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build
        env:
          CI: true

      - name: Get Previous Release Version
        id: get-previous-version
        run: |
          PREV_PKG_VERSION=$(npm pkg get version | tr -d '"')
          echo "prev-pkg-ver=$PREV_PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.release_token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Get Updated Release Version
        id: get-version
        run: |
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          echo "pkg-ver=$PKG_VERSION" >> "$GITHUB_OUTPUT"
